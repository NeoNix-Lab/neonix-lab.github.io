<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark slate rounded container -->
  <rect width="64" height="64" rx="16" fill="#080C14"/>
  
  <!-- Subtle gradient border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#border_grad)" stroke-width="2"/>
  
  <!-- Monogram Q in JetBrains Mono -->
  <text 
    x="50%" 
    y="55%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="'JetBrains Mono', 'Courier New', monospace" 
    font-size="34" 
    font-weight="800" 
    fill="url(#text_grad)"
    letter-spacing="-1"
  >Q</text>

  <!-- Linear Gradients -->
  <defs>
    <linearGradient id="border_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="text_grad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
</svg>
